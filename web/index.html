<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buzzer Host</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="host-top">
    <div>
      <h1>Host console</h1>
      <div class="row">
        <span class="status" id="status">Connecting…</span>
        <button class="small primary hidden" id="btnUsb">Connect hub by USB</button>
      </div>
    </div>
    <div class="row">
      <a href="display.html" target="_blank" rel="noopener"><button>Studio display</button></a>
      <a href="/admin" id="adminLink" target="_blank" rel="noopener"><button>Hub admin</button></a>
    </div>
  </div>

  <div class="notice hidden" id="notice"></div>

  <section class="panel">
    <div class="big-state" id="bigState">
      <div class="label" id="phaseLabel">Locked</div>
      <div class="value" id="phaseValue">Ready</div>
    </div>
    <div class="controls">
      <button class="armed" id="btnArm">Open buzzers<span class="kbd">Space</span></button>
      <button class="ok" id="btnCorrect">Correct<span class="kbd">C</span></button>
      <button class="bad" id="btnWrong">Wrong → reopen<span class="kbd">W</span></button>
      <button class="bad" id="btnWrongNext">Wrong → next in line<span class="kbd">N</span></button>
      <button id="btnLock">Lock / clear<span class="kbd">L</span></button>
      <button id="btnNewQ">New question<span class="kbd">Q</span></button>
    </div>
    <ul class="queue" id="queue"></ul>
  </section>

  <section class="panel" style="margin-top:16px">
    <div class="row" style="justify-content:space-between">
      <h3>Seats</h3>
      <span class="muted" id="podSummary"></span>
    </div>
    <div class="seats" id="seats"></div>
  </section>

  <section class="panel stack" style="margin-top:16px">
    <div>
      <label for="question">Question shown on studio display (optional)</label>
      <textarea id="question" rows="2" placeholder="Type the question, press Enter to publish"></textarea>
    </div>
    <div class="settings">
      <div><label for="seatCount">Seats in use</label><input id="seatCount" type="number" min="1" max="12"></div>
      <div><label for="points">Points for correct</label><input id="points" type="number" step="1"></div>
      <div><label for="penalty">Points lost for wrong</label><input id="penalty" type="number" step="1"></div>
      <div><label for="volume">Aux volume <span id="volumeVal"></span></label><input id="volume" type="range" min="0" max="100"></div>
    </div>
    <div class="row">
      <button class="small" data-sound="armed">Test: open</button>
      <button class="small" data-sound="buzz">Test: buzz</button>
      <button class="small" data-sound="correct">Test: correct</button>
      <button class="small" data-sound="wrong">Test: wrong</button>
      <span class="grow"></span>
      <button class="small" id="btnResetScores">Reset scores</button>
    </div>
  </section>
</div>
<input type="file" id="voiceFile" accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg,.webm" class="hidden">
<script src="js/link.js"></script>
<script src="js/voice.js"></script>
<script src="js/host.js"></script>
</body>
</html>
