<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Display</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="display">
  <section class="stage" id="stage">
    <div class="result" id="result"></div>
    <div class="phase" id="phase">Connecting…</div>
    <div class="winner" id="winner"></div>
    <div class="question" id="question"></div>
  </section>
  <aside class="side">
    <ul class="board" id="board"></ul>
    <span class="status" id="status" style="align-self:flex-start">Connecting…</span>
  </aside>
</div>
<button class="fs-btn" id="btnFull">Full screen</button>
<script src="js/link.js"></script>
<script src="js/display.js"></script>
</body>
</html>
