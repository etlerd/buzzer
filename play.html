<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss: ws:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="preconnect" href="https://broker.hivemq.com:8884" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Buzzer</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.0_2026-11-05">
</head>
<body>
<form class="join-form panel hidden" id="joinForm">
  <h1>Join the game</h1>
  <div class="stack">
    <div>
      <label for="room">Room code</label>
      <input id="room" class="code" autocomplete="off" autocapitalize="characters" maxlength="12" required>
    </div>
    <div>
      <label for="name">Your name</label>
      <input id="name" autocomplete="nickname" maxlength="20" required>
    </div>
    <button class="primary" type="submit">Join</button>
  </div>
</form>

<div class="player hidden" id="game">
  <header>
    <div class="me" id="me"></div>
    <div class="row">
      <span class="status" id="status">Connecting…</span>
    </div>
  </header>
  <div class="info" id="info">Connecting…</div>
  <div class="buzz-area">
    <button class="buzzer" id="buzzer" data-mode="locked" aria-label="Buzzer">WAIT</button>
  </div>
  <div class="row" style="justify-content:center">
    <button class="small" id="btnRename">Change name</button>
    <button class="small" id="btnLeave">Leave room</button>
  </div>
</div>

<script src="js/vendor/mqtt.min.js?v=mqtt-5.16.1"></script>
<script src="js/common.js?v=1.0.0_2026-11-05"></script>
<script src="js/version.js?v=1.0.0_2026-11-05"></script>
<script src="js/play.js?v=1.0.0_2026-11-05"></script>
</body>
</html>
